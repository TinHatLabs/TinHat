[workspace]
resolver = "2"
members = ["crates/streamer", "crates/app", "crates/dropcheck", "crates/theme", "crates/widgets", "crates/layout", "crates/actions"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/TinHatLabs/TinHat"

# Local vendored fork of the LiveKit CLIENT SDK (NOT the server). Patches unpublish_track to
# call transceiver.stop() so libwebrtc actually disposes the per-track NVENC encoder + its
# threads on unpublish — upstream leaks them for the call lifetime (~30 threads per re-publish:
# camera toggle / BRB cam-off / screen-share quality change). Vendored from crates.io 0.7.46;
# see vendor/livekit/src/room/participant/local_participant.rs (search "PATCH (Tin Hat").
# Also: create_sender offers every codec with the requested one first (the SFU pins a connection's video codecs on
# its first m-line, so a one-codec offer stuck every later share to the first one's codec) —
# vendor/livekit/src/rtc_engine/rtc_session.rs (search "PATCH (Tin Hat").
[patch.crates-io]
livekit = { path = "vendor/livekit" }
# Vendored fork of webrtc-sys 0.3.35 (was previously patched in-place in the cargo
# registry cache — now durable in-repo). Carries: NVENC encoder pinning
# (x-livekit-video-encoder-backend), H.264 packetization-mode decoder-match relaxation,
# and the NVDEC-receive-decode opt-in (LK_NVDEC=1; software H.264 decode by default —
# NvDecoder's reconfigure SEGVs on simulcast rung switches, see
# vendor/webrtc-sys/src/video_decoder_factory.cpp "PATCH (Tin Hat").
webrtc-sys = { path = "vendor/webrtc-sys" }
# Vendored libwebrtc wrapper (was an IN-PLACE registry patch — which silently does not
# travel to other build machines: the Windows VM compiled without nvenc_av1_available
# and produced a chimera build: new Rust, old C++). Carries: nvenc_av1_available() passthrough.
libwebrtc = { path = "vendor/libwebrtc" }
# Vendored webrtc-sys-build 0.3.18 (crates.io file, checksum 7d46da6b…) for one change: zip 0.6.6 -> 9.0.5 (the 2026-10-31
# Dependabot zip advisories; 0.6 has no fixed release) and an extraction that refuses unsafe entries
# (vendor/webrtc-sys-build/src/lib.rs, search "PATCH (Tin Hat"). Build-time only: it unpacks LiveKit's prebuilt
# libwebrtc when LK_CUSTOM_WEBRTC is unset; release builds set it and never call that code.
webrtc-sys-build = { path = "vendor/webrtc-sys-build" }
