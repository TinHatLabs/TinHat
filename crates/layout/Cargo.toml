[package]
name = "tinhat-layout"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tin Hat layout engine: Rust port of Tin Hat Web's TypeScript reference (LAYOUT.md v1) — forms, normalization, repair and validation, transactional operations, the integer solver, drop zones, the layouts document (save, merge, device sync) and the 10.6 migration. Pure: no Qt, no I/O, no clock, no randomness."

[lib]
path = "src/lib.rs"

[dependencies]
# The colour contract's JSON reader (json.rs parse_json: JSON.parse + nesting <= 128 + no lone surrogates) and its
# ECMAScript number / JSON.stringify string printers (canon.rs) — LAYOUT.md §1: "the layout engine reuses both".
tinhat-theme = { path = "../theme" }
# Only the Value type the theme reader produces (converted to this crate's JS-like value at the boundary).
serde_json = "1"
