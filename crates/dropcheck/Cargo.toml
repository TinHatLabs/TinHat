[package]
name = "tinhat-dropcheck"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Regression check: dropping a matrix-sdk sqlite-store Client off-runtime aborts; the runtime EnterGuard (see app main.rs) prevents it."

[dependencies]
matrix-sdk = { version = "0.18", default-features = false, features = ["e2e-encryption", "bundled-sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
time = "=0.3.47"

[[bin]]
name = "tinhat-dropcheck"
path = "src/main.rs"
