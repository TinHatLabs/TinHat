[package]
name = "tinhat-widgets"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tin Hat widgets' shared logic (modular UI step 2): a line-for-line Rust port of Tin Hat Web's TypeScript reference (src/widgets/*.ts) — call-stats maths, the tinhat.rxq message, the Up next clock, the widget registry and the call history — proven identical by the shared vectors. Pure: no Qt, no I/O."

[lib]
path = "src/lib.rs"

[dependencies]
# JSON.parse-compatible parsing, ECMAScript number printing and the canonical JSON the vectors compare (shared with
# the theme engine, which solved exactly this for its own vectors).
tinhat-theme = { path = "../theme" }
serde_json = "1"
